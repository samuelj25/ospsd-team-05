[project]
name = "calendar-task-api"
version = "0.1.0"
description = "Team-05 private extension: Google Tasks ABC and extended Client interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calendar-client-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_task_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/calendar_task_api/py.typed" = "calendar_task_api/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = []

[tool.uv.sources]
calendar-client-api = { workspace = true }